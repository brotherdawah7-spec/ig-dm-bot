name: Arabic comments report
on:
  push:
    paths: ["reports/arabic.request"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arabic-report
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r bot/requirements.txt
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: python bot/arabic_report.py
      - run: |
          git config user.name "dm-bot"; git config user.email "dm-bot@users.noreply.github.com"
          git add reports/arabic.json && git commit -m "arabic report [skip ci]" && git pull --rebase --autostash && git push
